name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/practical-pasteur-juwkh7]
  workflow_dispatch:
  # Pages are generated at build time, so DST standings and transition dates
  # would otherwise go stale. A daily rebuild keeps them current.
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Two pushes close together previously raced for the same Pages deployment and
# the older run failed with "in progress deployment". A newer commit supersedes
# an older one here, so cancel the superseded run rather than letting both go.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run time library tests
        run: ./tests/run.sh

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static export
        run: npm run build:pages
        env:
          # Serve from the repository subpath that Pages assigns.
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
